
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickNotes System Design</title>
    <link rel="stylesheet" href="style.css">
    <script src="api.js" defer></script>
</head>
<body>
    <main class="container">
        <h1>QuickNotes</h1>
        <p>Manage your notes using an online practice API.</p>

        <button id="load-btn" type="button">Load notes</button>
        <p id="status" role="status" aria-live="polite"></p>

        <section>
            <h2>Create a note</h2>

            <form id="note-form">
                <label for="title-input">Note title</label>
                <input
                    id="title-input"
                    name="title"
                    type="text"
                    maxlength="100"
                    required
                >

                <label for="body-input">Note body (optional)</label>
                <textarea
                    id="body-input"
                    name="body"
                    rows="4"
                ></textarea>

                <button id="submit-btn" type="submit">
                    Create note
                </button>
            </form>
        </section>

        <section>
            <h2>Your notes</h2>
            <ul id="notes-list"></ul>
        </section>
    </main>
</body>
</html>
